name: Build and Push Frappe Custom Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps.json'
      - 'images/**'
      - 'resources/**'
      - '.github/workflows/build-custom.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/frappe-custom

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate apps.json
        run: |
          if [ ! -f apps.json ]; then
            echo "Error: apps.json not found"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('apps.json')); print(f'Valid JSON: {len(d)} apps')"

      - name: Create docker-container builder
        run: |
          docker buildx create --use --name frappe-builder --driver docker-container || true
          docker buildx inspect frappe-builder --bootstrap

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./images/layered/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_BRANCH=version-16
