name: Build and Push Frappe Custom Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps.json'
      - 'images/**'
      - 'resources/**'
      - '.github/workflows/build-custom.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
      push:
        description: 'Push to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/frappe-custom

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate apps.json
        run: |
          if [ ! -f apps.json ]; then
            echo "Error: apps.json not found at repository root"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('apps.json')); print(f'Valid JSON with {len(d)} apps')"
          echo "Apps list (URLs masked):"
          jq -r '.[].url' apps.json | sed 's|https://[^@]*@|https://***@|g' | sed 's|https://github.com/|github:|g'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./images/layered/Containerfile
          push: ${{ inputs.push != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            apps_json=apps.json
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_BRANCH=version-16
