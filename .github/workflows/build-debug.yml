name: Build Custom Frappe Image (Debug)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/frappe-custom

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Check files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== apps.json exists? ==="
          test -f apps.json && echo "YES" || echo "NO"
          echo "=== apps.json size ==="
          wc -c apps.json
          echo "=== apps.json content ==="
          cat apps.json
          echo "=== JSON validation ==="
          python3 -c "import json; d=json.load(open('apps.json')); print(f'Valid JSON with {len(d)} apps')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - Buildx info
        run: |
          docker --version
          docker buildx version
          docker buildx ls

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./images/layered/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            apps_json=apps.json
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_BRANCH=version-16
